[project]
name = "mycelium"
version = "0.1.0"
description = "Shared context graph for every AI agent in a company, on FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = [
  "falkordb>=1.1",
  "fastembed>=0.5",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
